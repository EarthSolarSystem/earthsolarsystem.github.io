<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр балластной системы судна</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#07101a;color:#c9dced;
  font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  display:flex;overflow:hidden;
}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
#cv{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 12px 50px rgba(0,0,0,.75)}
#panel{width:390px;flex:0 0 390px;background:#0c1824;border-left:1px solid #17303f;overflow-y:auto;padding:16px 16px 70px}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#1b3span;background:#1b3a4f;border-radius:4px}
h1{font-size:17px;margin:0 0 2px;letter-spacing:.4px;color:#e8f4ff}
.sub{font-size:10.5px;color:#5e7f97;margin:0 0 14px;letter-spacing:1px;text-transform:uppercase}
.card{background:#0f1e2b;border:1px solid #17303f;border-radius:10px;padding:12px;margin-bottom:11px}
.card h2{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#6e93ad;margin:0 0 10px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
.row.small{font-size:11px;color:#7b9ab0}
.row b{font-variant-numeric:tabular-nums;font-weight:600;color:#e6f2fb}
.seg{display:flex;gap:6px;margin-bottom:9px}
.seg button{flex:1;padding:8px;font-size:12px;border-radius:7px;border:1px solid #22415a;background:#0b1a26;color:#6e93ad;cursor:pointer;transition:.15s;font-weight:600}
.seg button.active{background:#123a55;border-color:#2f83c0;color:#5fc8ff;box-shadow:0 0 12px rgba(60,160,230,.2)}
.big{width:100%;padding:12px;border-radius:8px;border:1px solid #1f6b45;background:#0d2e20;color:#4fe89a;font-weight:700;letter-spacing:1.5px;font-size:13px;cursor:pointer;transition:.15s}
.big.on{background:#123f2b;border-color:#37d98a;color:#7dffbe;box-shadow:0 0 20px rgba(55,217,138,.3)}
.big:hover{filter:brightness(1.2)}
input[type=range]{width:100%;accent-color:#37c2ff;margin:6px 0}
.tank{border:1px solid #17303f;border-radius:8px;padding:8px 9px;margin-bottom:7px;background:#0b1721}
.tank-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tank-name{font-size:12px;font-weight:600;color:#b9d3e6}
.valve{font-size:9px;letter-spacing:.6px;padding:3px 9px;border-radius:20px;border:1px solid #2b4a60;background:#12283a;color:#6e93ad;cursor:pointer;transition:.15s;font-weight:700}
.valve.open{background:#0f3d2a;border-color:#2fa86b;color:#4fe89a;box-shadow:0 0 10px rgba(79,232,154,.3)}
.bar{height:8px;background:#08141d;border-radius:4px;overflow:hidden;border:1px solid #17303f}
.bar .fill{height:100%;width:0;background:linear-gradient(90deg,#1b6fb0,#43c6ff);transition:width .12s linear}
.bar.full .fill{background:linear-gradient(90deg,#1f9e63,#4fe89a)}
.tank-meta{display:flex;justify-content:space-between;font-size:10px;color:#5e7f97;margin-top:4px;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{flex:1 1 46%;padding:8px;font-size:11px;border-radius:7px;border:1px solid #22415a;background:#0b1a26;color:#8fb4cd;cursor:pointer;transition:.15s;font-weight:600}
.presets button:hover{background:#123a55;color:#5fc8ff}
.warn{color:#ff5f6d!important;text-shadow:0 0 12px rgba(255,95,109,.5)}
.ok{color:#4fe89a!important}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:#8fb4cd;cursor:pointer;user-select:none}
.chk input{accent-color:#37c2ff;cursor:pointer}
@media(max-width:900px){
  body{flex-direction:column;overflow:auto}
  #panel{width:100%;flex:none;border-left:none;border-top:1px solid #17303f}
  #stage{padding:4px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<aside id="panel">
  <h1>Балластная система</h1>
  <p class="sub">Тренажёр · сухогруз 100 × 16 м</p>

  <section class="card">
    <h2>Судовое время</h2>
    <div class="row"><span>Ходовое время</span><b id="clock">00:00:00</b></div>
    <input type="range" id="speed" min="1" max="300" step="1" value="60">
    <div class="row small"><span>Ускорение времени</span><b id="speedVal">60×</b></div>
  </section>

  <section class="card">
    <h2>Балластный насос</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="fill" class="active">Приём балласта</button>
      <button data-mode="drain">Откачка</button>
    </div>
    <button id="pumpBtn" class="big">ПУСК НАСОСА</button>
    <div class="row small" style="margin-top:8px"><span>Производительность</span><b>400 м³/ч</b></div>
  </section>

  <section class="card">
    <h2>Балластные цистерны</h2>
    <div id="tankList"></div>
  </section>

  <section class="card">
    <h2>Посадка и остойчивость</h2>
    <div id="readouts"></div>
  </section>

  <section class="card">
    <h2>Сценарии</h2>
    <div class="presets">
      <button data-preset="empty">Без балласта</button>
      <button data-preset="full">Полный балласт</button>
      <button data-preset="bow">Дифферент на нос</button>
      <button data-preset="stern">Дифферент на корму</button>
    </div>
  </section>

  <section class="card">
    <label class="chk"><input type="checkbox" id="termsChk" checked> Показывать судовые термины</label>
  </section>
</aside>

<script>
(function(){
'use strict';

/* ======================= КОНСТАНТЫ ======================= */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const CW = 1120, CH = 640;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width  = CW * DPR;
cv.height = CH * DPR;

const SCALE = 8.5;      // px на метр
const MID_X = 560;      // экранная X мидель-шпангоута
const SEA_Y = 372;      // экранная Y ватерлинии
const RHO   = 1.025;    // плотность забортной воды, т/м³

const SHIP = {
  L:100, B:16, D:8, Cb:0.70,
  lightW:2800, lightKG:6.8, lightLCG:0.5,
  Aw:1280, Iw:15360, IL:800000,
  LCB:0.3
};

const TANKS = [
  {id:'fp',  name:'Форпик',           x1: 44.0, x2: 49.4, y1:0.4, y2:5.0, cap:200, beam:8},
  {id:'db1', name:'Цистерна №1 (ДБ)', x1: 20.0, x2: 38.0, y1:0.4, y2:2.0, cap:320, beam:8},
  {id:'db2', name:'Цистерна №2 (ДБ)', x1:  2.0, x2: 18.0, y1:0.4, y2:2.0, cap:340, beam:8},
  {id:'db3', name:'Цистерна №3 (ДБ)', x1:-16.0, x2:  0.0, y1:0.4, y2:2.0, cap:340, beam:8},
  {id:'db4', name:'Цистерна №4 (ДБ)', x1:-34.0, x2:-18.0, y1:0.4, y2:2.0, cap:320, beam:8},
  {id:'ap',  name:'Ахтерпик',          x1:-49.4, x2:-44.0, y1:0.4, y2:5.0, cap:230, beam:8}
];
const SHORT = {fp:'ФП', db1:'№1', db2:'№2', db3:'№3', db4:'№4', ap:'АП'};
TANKS.forEach(t=>{ t.cx = (t.x1+t.x2)/2; });

const MAIN_Y = 6.0;     // высота балластной магистрали
const PUMP_X = -37;     // положение насоса

/* ======================= СОСТОЯНИЕ ======================= */
const state = {
  vol:{}, valve:{},
  pumpOn:false, mode:'fill', rate:400,
  speed:60, simTime:0,
  showTerms:true, flowPhase:0, flowing:false, t:0
};
TANKS.forEach(t=>{ state.vol[t.id]=0; state.valve[t.id]=false; });

let hydro = {};

/* ======================= ФИЗИКА ======================= */
function computeHydro(){
  let W  = SHIP.lightW;
  let mx = SHIP.lightW * SHIP.lightLCG;
  let mz = SHIP.lightW * SHIP.lightKG;
  let fsm = 0, ballastW = 0;

  for(const t of TANKS){
    const v = state.vol[t.id];
    if(v <= 0.001) continue;
    const w = v * RHO;
    const f = v / t.cap;
    const h = f * (t.y2 - t.y1);
    const xc = t.cx;
    const zc = t.y1 + h/2;          // ЦТ воды в цистерне
    W += w; ballastW += w;
    mx += w * xc;
    mz += w * zc;
    if(f > 0.02 && f < 0.98){       // свободная поверхность
      const l = t.x2 - t.x1;
      fsm += RHO * l * Math.pow(t.beam,3) / 12;
    }
  }

  const LCG = mx / W;
  const KG  = mz / W;
  const V   = W / RHO;
  const T   = V / (SHIP.L * SHIP.B * SHIP.Cb);   // средняя осадка
  const KB  = 0.53 * T;
  const BM  = SHIP.Iw / V;
  const KM  = KB + BM;
  const GM0 = KM - KG;
  const FSC = fsm / W;
  const GM  = GM0 - FSC;

  const KML  = KB + SHIP.IL / V;
  const GML  = KML - KG;
  const MCTC = W * Math.max(GML, 30) / (100 * SHIP.L);  // т·м/см

  const trim = -W * (LCG - SHIP.LCB) / (MCTC * 100);    // + на корму
  const Tf = T - trim/2;
  const Ta = T + trim/2;

  hydro = {W, ballastW, LCG, KG, V, T, KB, BM, KM, GM0, FSC, GM, MCTC, trim, Tf, Ta};
}

/* ======================= ШАГ СИМУЛЯЦИИ ======================= */
function step(dt){
  state.t += dt;
  const simDt = dt * state.speed;          // секунды модельного времени
  state.simTime += simDt;
  const hours = simDt / 3600;

  state.flowing = false;
  if(state.pumpOn){
    const active = TANKS.filter(t=>{
      if(!state.valve[t.id]) return false;
      return state.mode === 'fill'
        ? state.vol[t.id] < t.cap - 0.01
        : state.vol[t.id] > 0.01;
    });
    if(active.length){
      state.flowing = true;
      const per = state.rate * hours / active.length;
      for(const t of active){
        if(state.mode === 'fill')
          state.vol[t.id] = Math.min(t.cap, state.vol[t.id] + per);
        else
          state.vol[t.id] = Math.max(0, state.vol[t.id] - per);
      }
    }
  }
  if(state.flowing) state.flowPhase = (state.flowPhase + dt * 90) % 28;

  computeHydro();
}

/* ======================= ОТРИСОВКА ======================= */
function base(){ ctx.setTransform(DPR,0,0,DPR,0,0); }

function hullPath(){
  const S = SCALE;
  ctx.beginPath();
  ctx.moveTo(-50*S, -8*S);
  ctx.lineTo(-50*S, -3.6*S);
  ctx.quadraticCurveTo(-50*S, -0.9*S, -45*S, -0.4*S);
  ctx.lineTo(43*S, -0.4*S);
  ctx.quadraticCurveTo(52*S, -1.0*S, 51*S, -8*S);
  ctx.closePath();
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,SEA_Y);
  g.addColorStop(0,'#0b2136');
  g.addColorStop(0.55,'#164a6b');
  g.addColorStop(1,'#2f7ba5');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,CW,SEA_Y);

  // луна/солнце блик
  const sun = ctx.createRadialGradient(880,90,4,880,90,110);
  sun.addColorStop(0,'rgba(220,245,255,.55)');
  sun.addColorStop(1,'rgba(220,245,255,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(760,-20,260,240);
}

function drawSea(){
  const g = ctx.createLinearGradient(0,SEA_Y,0,CH);
  g.addColorStop(0,'#2f86bd');
  g.addColorStop(0.25,'#1b5f92');
  g.addColorStop(1,'#08263f');
  ctx.fillStyle = g;
  ctx.fillRect(0,SEA_Y,CW,CH-SEA_Y);

  // волновая линия
  ctx.beginPath();
  for(let x=0;x<=CW;x+=6){
    const y = SEA_Y + Math.sin(x*0.021 + state.t*1.4)*2.6
                    + Math.sin(x*0.055 - state.t*2.1)*1.2;
    x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(150,225,255,.65)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // подводные блики
  ctx.strokeStyle = 'rgba(120,200,255,.08)';
  ctx.lineWidth = 1;
  for(let i=0;i<7;i++){
    const y = SEA_Y + 28 + i*38 + Math.sin(state.t*0.6 + i)*4;
    ctx.beginPath();
    ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke();
  }
}

function drawSuperstructure(){
  const S = SCALE;
  const ink = '#1b2530';
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = ink;

  // ---- бак (полубак) ----
  ctx.beginPath();
  ctx.moveTo(36*S,-8*S); ctx.lineTo(51*S,-8*S);
  ctx.lineTo(51*S,-10.5*S); ctx.lineTo(36*S,-10.5*S); ctx.closePath();
  ctx.fillStyle = '#4a5967'; ctx.fill(); ctx.stroke();

  // ---- ют ----
  ctx.beginPath();
  ctx.moveTo(-50*S,-8*S); ctx.lineTo(-36*S,-8*S);
  ctx.lineTo(-36*S,-10.5*S); ctx.lineTo(-50*S,-10.5*S); ctx.closePath();
  ctx.fillStyle = '#4a5967'; ctx.fill(); ctx.stroke();

  // ---- палуба между баком и ютом ----
  ctx.beginPath();
  ctx.moveTo(-36*S,-8*S); ctx.lineTo(36*S,-8*S);
  ctx.strokeStyle = '#5f7181'; ctx.lineWidth = 2.2; ctx.stroke();

  // ---- надстройка ----
  ctx.beginPath();
  ctx.rect(-30*S, -15*S, 22*S, 7*S);
  const gg = ctx.createLinearGradient(-30*S,-15*S,-30*S,-8*S);
  gg.addColorStop(0,'#dbe6ee'); gg.addColorStop(1,'#a9bccb');
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 1.2; ctx.stroke();

  // окна
  ctx.fillStyle = '#2b6f96';
  for(let i=0;i<6;i++){
    ctx.fillRect((-28+i*3.4)*S, -12.6*S, 2.2*S, 1.1*S);
  }
  ctx.fillStyle = '#8fc4e0';
  ctx.fillRect(-29*S, -14.3*S, 20*S, 0.7*S);

  // ---- ходовой мостик ----
  ctx.beginPath();
  ctx.rect(-33*S, -14.2*S, 28*S, 1.6*S);
  ctx.fillStyle = '#c7d6e1'; ctx.fill();
  ctx.strokeStyle = ink; ctx.stroke();
  ctx.fillStyle = '#2b6f96';
  for(let i=0;i<9;i++){
    ctx.fillRect((-32+i*3.1)*S, -13.8*S, 2.2*S, 0.8*S);
  }

  // ---- дымовая труба ----
  ctx.beginPath();
  ctx.moveTo(-22*S,-15*S); ctx.lineTo(-17*S,-15*S);
  ctx.lineTo(-16.4*S,-20*S); ctx.lineTo(-21.6*S,-20*S); ctx.closePath();
  ctx.fillStyle = '#2b3a47'; ctx.fill();
  ctx.strokeStyle = ink; ctx.stroke();
  ctx.fillStyle = '#c94a3e';
  ctx.fillRect(-21.4*S,-18.6*S,4.4*S,1.1*S);

  // ---- мачта ----
  ctx.strokeStyle = '#8ea6b8'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-26*S,-15*S); ctx.lineTo(-26*S,-22*S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-30*S,-20.5*S); ctx.lineTo(-22*S,-20.5*S); ctx.stroke();

  // ---- фок-мачта ----
  ctx.beginPath(); ctx.moveTo(43*S,-10.5*S); ctx.lineTo(43*S,-17*S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40*S,-15.5*S); ctx.lineTo(46*S,-15.5*S); ctx.stroke();

  // ---- грузовые стрелы / краны (намёк) ----
  ctx.strokeStyle = '#7d93a5'; ctx.lineWidth = 1.4;
  [[26,1],[6,1],[-12,1]].forEach(([x])=>{
    ctx.beginPath();
    ctx.moveTo(x*S,-8*S);
    ctx.lineTo((x-7)*S,-13*S);
    ctx.stroke();
  });
}

function drawTanks(){
  const S = SCALE;
  for(const t of TANKS){
    const l = t.x1*S, r = t.x2*S;
    const top = -t.y2*S, bot = -t.y1*S;
    const w = r-l, h = bot-top;

    // фон цистерны
    ctx.fillStyle = 'rgba(120,180,225,.07)';
    ctx.fillRect(l, top, w, h);

    // вода
    const v = state.vol[t.id];
    if(v > 0.4){
      const f = v / t.cap;
      const wl = t.y1 + f*(t.y2 - t.y1);
      const wtop = -wl*S;
      const g = ctx.createLinearGradient(0, wtop, 0, bot);
      g.addColorStop(0,'rgba(90,200,255,.85)');
      g.addColorStop(1,'rgba(28,105,185,.95)');
      ctx.fillStyle = g;
      ctx.fillRect(l, wtop, w, bot - wtop);

      // поверхность воды
      ctx.strokeStyle = 'rgba(170,235,255,.95)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(l, wtop);
      for(let x=l;x<=r;x+=5)
        ctx.lineTo(x, wtop + Math.sin((x-l)*0.25 + state.t*2.4)*0.9);
      ctx.stroke();
    }

    // контур
    ctx.strokeStyle = 'rgba(140,195,235,.6)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(l, top, w, h);
  }
}

function drawPipes(){
  const S = SCALE;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const mainL = -47*S, mainR = 47*S, mainY = -MAIN_Y*S;

  // магистраль + ветки + кингстон
  const paths = [];
  paths.push([[mainL,mainY],[mainR,mainY]]);
  for(const t of TANKS){
    paths.push([[t.cx*S, mainY], [t.cx*S, -t.y2*S]]);
  }
  paths.push([[PUMP_X*S, mainY], [PUMP_X*S, -0.2*S]]);

  // тень труб
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 5;
  for(const p of paths){
    ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]+1); ctx.lineTo(p[1][0],p[1][1]+1); ctx.stroke();
  }
  // сами трубы
  ctx.strokeStyle = '#8aa4b8';
  ctx.lineWidth = 3;
  for(const p of paths){
    ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); ctx.lineTo(p[1][0],p[1][1]); ctx.stroke();
  }
  ctx.strokeStyle = '#5d768a';
  ctx.lineWidth = 1;
  for(const p of paths){
    ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); ctx.lineTo(p[1][0],p[1][1]); ctx.stroke();
  }

  // поток (анимация)
  if(state.pumpOn && state.flowing){
    ctx.strokeStyle = '#4fd8ff';
    ctx.lineWidth = 3;
    ctx.setLineDash([6,10]);
    ctx.lineDashOffset = -state.flowPhase;
    for(const p of paths){
      ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); ctx.lineTo(p[1][0],p[1][1]); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // клапаны
  for(const t of TANKS){
    const x = t.cx*S, y = mainY;
    const open = state.valve[t.id];
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = open ? '#4fe89a' : '#8a3b45';
    ctx.fill();
    ctx.strokeStyle = '#0b1721'; ctx.lineWidth = 1.5; ctx.stroke();
    if(open){
      ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(79,232,154,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  // насос
  ctx.beginPath();
  ctx.arc(PUMP_X*S, mainY, 8, 0, Math.PI*2);
  ctx.fillStyle = state.pumpOn ? '#1f9e63' : '#3a4c5c';
  ctx.fill();
  ctx.strokeStyle = state.pumpOn ? '#7dffbe' : '#5d768a';
  ctx.lineWidth = 2; ctx.stroke();
  // лопасти
  ctx.save();
  ctx.translate(PUMP_X*S, mainY);
  ctx.rotate(state.pumpOn ? state.t*9 : 0);
  ctx.strokeStyle = state.pumpOn ? '#c9ffe6' : '#8aa4b8';
  ctx.lineWidth = 1.6;
  for(let i=0;i<3;i++){
    ctx.rotate(Math.PI/3);
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.stroke();
  }
  ctx.restore();

  // кингстон (приёмный клапан)
  const kx = PUMP_X*S, ky = -0.2*S;
  ctx.beginPath();
  ctx.moveTo(kx-7, ky); ctx.lineTo(kx+7, ky); ctx.lineTo(kx+4, ky+5); ctx.lineTo(kx-4, ky+5);
  ctx.closePath();
  ctx.fillStyle = '#3a6b8a'; ctx.fill();
  ctx.strokeStyle = '#8fd4ff'; ctx.lineWidth = 1.2; ctx.stroke();
}

function drawShip(){
  const th = -Math.atan(hydro.trim / SHIP.L);
  const keelY = SEA_Y + hydro.T * SCALE;

  ctx.save();
  ctx.translate(MID_X, keelY);
  ctx.rotate(th);

  // корпус
  hullPath();
  ctx.fillStyle = '#3d4a57';
  ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = '#131c25';
  ctx.stroke();

  // подводная часть (окраска)
  ctx.save();
  hullPath();
  ctx.clip();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#7c2b30';
  ctx.fillRect(0, SEA_Y, CW, CH - SEA_Y);
  ctx.restore();

  // дейдвуд / ахтерштевень
  const S = SCALE;
  ctx.beginPath();
  ctx.moveTo(-50*S,-0.4*S); ctx.lineTo(-50*S,-3.6*S);
  ctx.strokeStyle = '#131c25'; ctx.lineWidth = 2.4; ctx.stroke();

  drawSuperstructure();
  drawTanks();
  drawPipes();

  ctx.restore();
}

/* ---------- подписи (в экранных координатах, без наклона) ---------- */
function toScreen(x, y){
  const th = -Math.atan(hydro.trim / SHIP.L);
  const keelY = SEA_Y + hydro.T * SCALE;
  const px = x*SCALE, py = -y*SCALE;
  return {
    x: MID_X + px*Math.cos(th) - py*Math.sin(th),
    y: keelY + px*Math.sin(th) + py*Math.cos(th)
  };
}

function drawLabels(){
  ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  ctx.textBaseline = 'middle';

  // ---- метки цистерн ----
  if(state.showTerms){
    ctx.textAlign = 'center';
    for(const t of TANKS){
      const p = toScreen(t.cx, (t.y1+t.y2)/2);
      const f = state.vol[t.id]/t.cap;
      ctx.fillStyle = f > 0.5 ? 'rgba(6,20,32,.85)' : 'rgba(160,205,235,.85)';
      ctx.font = '700 9px "Segoe UI",system-ui,sans-serif';
      ctx.fillText(SHORT[t.id], p.x, p.y);
    }
  }

  if(!state.showTerms) return;

  const items = [
    {t:'Форштевень',   x: 51,  y: 4.0,  dx: 16, dy:-34, align:'left'},
    {t:'Ахтерштевень', x:-50,  y: 2.6,  dx:-14, dy: 30, align:'right'},
    {t:'Бак',          x: 43,  y: 10.5, dx:  0, dy:-20, align:'center'},
    {t:'Ют',           x:-43,  y: 10.5, dx:  0, dy:-20, align:'center'},
    {t:'Надстройка',   x:-19,  y: 15.0, dx:  0, dy:-22, align:'center'},
    {t:'Ходовой мостик',x:-33, y: 13.4, dx:-16, dy:-16, align:'right'},
    {t:'Дымовая труба',x:-19.5,y: 20.0, dx:  0, dy:-16, align:'center'},
    {t:'Киль',         x: 18,  y: 0.4,  dx:  0, dy: 30, align:'center'},
    {t:'Мидель-шпангоут',x: 0, y: 8.0,  dx:  0, dy:-22, align:'center'}
  ];

  for(const it of items){
    const p = toScreen(it.x, it.y);
    const lx = p.x + it.dx, ly = p.y + it.dy;

    ctx.strokeStyle = 'rgba(110,190,240,.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(lx,ly); ctx.stroke();

    ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
    ctx.fillStyle = '#5fd0ff'; ctx.fill();

    const w = ctx.measureText(it.t).width;
    let bx = lx;
    if(it.align==='center') bx = lx - w/2;
    else if(it.align==='right') bx = lx - w;

    ctx.fillStyle = 'rgba(8,20,32,.78)';
    ctx.fillRect(bx-5, ly-8.5, w+10, 17);

    ctx.textAlign = it.align || 'center';
    ctx.fillStyle = '#a8dcff';
    ctx.fillText(it.t, lx, ly);
  }

  // ватерлиния
  ctx.textAlign = 'left';
  ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(140,220,255,.9)';
  ctx.fillText('Ватерлиния (ВЛ)', 18, SEA_Y - 12);
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = 'rgba(140,220,255,.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, SEA_Y+1); ctx.lineTo(CW, SEA_Y+1); ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- HUD на канвасе ---------- */
function drawHUD(){
  const lines = [
    ['Осадка носом',  hydro.Tf.toFixed(2) + ' м'],
    ['Осадка кормой', hydro.Ta.toFixed(2) + ' м'],
    ['Дифферент',     Math.abs(hydro.trim).toFixed(2) + ' м ' + (hydro.trim>0.02?'на корму':hydro.trim<-0.02?'на нос':'ровный')],
    ['Водоизмещение', Math.round(hydro.W) + ' т'],
    ['GM',            hydro.GM.toFixed(2) + ' м']
  ];
  ctx.fillStyle = 'rgba(8,20,32,.72)';
  ctx.strokeStyle = 'rgba(60,130,180,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(16, 16, 232, 22 + lines.length*19, 9);
  ctx.fill(); ctx.stroke();

  ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  ctx.textBaseline = 'middle';
  let y = 34;
  for(const [k,v] of lines){
    ctx.textAlign = 'left';
    ctx.fillStyle = '#7b9ab0';
    ctx.fillText(k, 30, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = (k==='GM' && hydro.GM < 0.15) ? '#ff5f6d' : '#dff0fb';
    ctx.fillText(v, 236, y);
    y += 19;
  }
}

function render(){
  base();
  ctx.clearRect(0,0,CW,CH);
  drawSky();
  drawSea();
  drawShip();
  drawLabels();
  drawHUD();
}

/* ======================= ИНТЕРФЕЙС ======================= */
const tankEls = {};
const tankList = document.getElementById('tankList');

TANKS.forEach(t=>{
  const div = document.createElement('div');
  div.className = 'tank';
  div.innerHTML = `
    <div class="tank-head">
      <span class="tank-name">${t.name}</span>
      <button class="valve" data-id="${t.id}">КЛАПАН</button>
    </div>
    <div class="bar"><div class="fill"></div></div>
    <div class="tank-meta"><span class="val">0 / ${t.cap} м³</span><span class="pct">0%</span></div>`;
  tankList.appendChild(div);

  const valveBtn = div.querySelector('.valve');
  valveBtn.addEventListener('click', ()=>{
    state.valve[t.id] = !state.valve[t.id];
    valveBtn.classList.toggle('open', state.valve[t.id]);
  });

  tankEls[t.id] = {
    fill: div.querySelector('.fill'),
    bar:  div.querySelector('.bar'),
    val:  div.querySelector('.val'),
    pct:  div.querySelector('.pct'),
    valveBtn
  };
});

/* ---- показания ---- */
const READOUTS = [
  ['disp',  'Водоизмещение, т'],
  ['bal',   'Балласт, т'],
  ['tf',    'Осадка носом, м'],
  ['ta',    'Осадка кормой, м'],
  ['tm',    'Средняя осадка, м'],
  ['trim',  'Дифферент, м'],
  ['kg',    'Аппликата ЦТ (KG), м'],
  ['km',    'Метацентр. радиус (KM), м'],
  ['fsc',   'Поправка на своб. поверхн., м'],
  ['gm',    'Метацентр. высота (GM), м']
];
const readoutEls = {};
const rWrap = document.getElementById('readouts');
READOUTS.forEach(([id,label])=>{
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span>${label}</span><b id="ro_${id}">—</b>`;
  rWrap.appendChild(row);
  readoutEls[id] = row.querySelector('b');
});

/* ---- элементы управления ---- */
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', ()=>{
  state.speed = +speedSlider.value;
  speedVal.textContent = state.speed + '×';
});

document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('active', x===b));
  });
});

const pumpBtn = document.getElementById('pumpBtn');
pumpBtn.addEventListener('click', ()=>{
  state.pumpOn = !state.pumpOn;
  pumpBtn.textContent = state.pumpOn ? 'СТОП НАСОСА' : 'ПУСК НАСОСА';
  pumpBtn.classList.toggle('on', state.pumpOn);
});

document.getElementById('termsChk').addEventListener('change', e=>{
  state.showTerms = e.target.checked;
});

document.querySelectorAll('.presets button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const p = b.dataset.preset;
    TANKS.forEach(t=>{
      if(p==='empty') state.vol[t.id] = 0;
      else if(p==='full') state.vol[t.id] = t.cap;
      else if(p==='bow') state.vol[t.id] = (t.id==='fp'||t.id==='db1') ? t.cap : 0;
      else if(p==='stern') state.vol[t.id] = (t.id==='ap'||t.id==='db4') ? t.cap : 0;
    });
    computeHydro();
  });
});

/* ---- обновление панели ---- */
function fmtTime(sec){
  const h = Math.floor(sec/3600)%24;
  const m = Math.floor(sec/60)%60;
  const s = Math.floor(sec)%60;
  return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
}

function updateUI(){
  document.getElementById('clock').textContent = fmtTime(state.simTime);

  for(const t of TANKS){
    const el = tankEls[t.id];
    const v = state.vol[t.id];
    const f = v / t.cap;
    el.fill.style.width = (f*100) + '%';
    el.bar.classList.toggle('full', f > 0.995);
    el.val.textContent = `${v.toFixed(0)} / ${t.cap} м³`;
    el.pct.textContent = (f*100).toFixed(0) + '%';
    el.valveBtn.classList.toggle('open', state.valve[t.id]);
  }

  readoutEls.disp.textContent  = Math.round(hydro.W);
  readoutEls.bal.textContent   = Math.round(hydro.ballastW);
  readoutEls.tf.textContent    = hydro.Tf.toFixed(2);
  readoutEls.ta.textContent    = hydro.Ta.toFixed(2);
  readoutEls.tm.textContent    = hydro.T.toFixed(2);
  readoutEls.trim.textContent  = (hydro.trim>=0?'+':'') + hydro.trim.toFixed(2);
  readoutEls.kg.textContent    = hydro.KG.toFixed(2);
  readoutEls.km.textContent    = hydro.KM.toFixed(2);
  readoutEls.fsc.textContent   = hydro.FSC.toFixed(3);
  readoutEls.gm.textContent    = hydro.GM.toFixed(2);
  readoutEls.gm.className = hydro.GM < 0.15 ? 'warn' : 'ok';
}

/* ======================= ЦИКЛ ======================= */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.1) dt = 0.1;

  step(dt);
  render();
  updateUI();

  requestAnimationFrame(loop);
}

/* ======================= СТАРТ ======================= */
computeHydro();
requestAnimationFrame(t=>{ last = t; loop(t); });

})();
</script>
